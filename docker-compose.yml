# Local development services for Laluan Kitani.
# Start with: docker compose up -d
name: laluankitani

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    # The database password comes from the git-ignored .env next to this file
    # (copy .env.example). Compose stops with an error if .env is missing.
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: laluan
      POSTGRES_DB: laluankitani
    ports:
      # Reachable from this machine only, not from the local network
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first created
      - ./infra/db/init/00-create-test-db.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laluan -d laluankitani"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Map tiles for the mobile app (see infra/tiles/README.md to build brunei.pmtiles).
  # Open on the local network so a phone on the same Wi-Fi can load the map.
  # Map data is public OpenStreetMap data, so this exposes nothing private.
  tiles:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/tiles/data:/srv/tiles:ro
      - ./infra/tiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # GraphHopper routing engine (see infra/routing/README.md to get brunei.osm.pbf).
  # Only the API talks to it, so it listens on this machine only.
  # First start builds the graph into infra/routing/data/graph-cache (about a minute);
  # delete that folder after updating brunei.osm.pbf to rebuild it.
  # Built locally from the official GraphHopper release (infra/routing/Dockerfile)
  routing:
    build: ./infra/routing
    image: laluankitani-routing:11.1
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx1g -Xms512m"
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ./infra/routing/data:/data
      - ./infra/routing/config.yml:/config/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8989/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  pgdata:
