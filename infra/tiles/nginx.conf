# Serves the Brunei PMTiles map file. PMTiles needs HTTP range requests,
# which Nginx supports for static files out of the box.
server {
    listen 80;
    server_name _;

    location /tiles/ {
        alias /srv/tiles/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        add_header Cache-Control "public, max-age=3600" always;
        types { application/vnd.pmtiles pmtiles; }

        # Browsers (the map in a WebView) check Range requests with a preflight first
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /health {
        return 200 "ok\n";
    }
}
